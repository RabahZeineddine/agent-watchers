services:
  agent-watchers:
    build: .
    container_name: agent-watchers-hub
    ports:
      - "8080:8080"
    environment:
      - LLM_PROVIDER=${LLM_PROVIDER:-openai_compatible}
      - LLM_API_BASE=${LLM_API_BASE:-https://api.openai.com/v1}
      - LLM_API_KEY=${LLM_API_KEY}
      - FAST_MODEL=${FAST_MODEL:-gpt-4o-mini}
      - REASONING_MODEL=${REASONING_MODEL:-gpt-4o}
      - TASK_TRACKER_PROVIDER=${TASK_TRACKER_PROVIDER:-shortcut}
      - TASK_TRACKER_TOKEN=${TASK_TRACKER_TOKEN}
      - GITHUB_USER=${GITHUB_USER}
    volumes:
      - ./data:/app/data
      - ./config.yaml:/app/config.yaml
    restart: unless-stopped
