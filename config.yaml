# ==========================================
# Agent Watchers & Personal AI Hub - Config
# ==========================================

# User identity (used to distinguish your own PRs from team PRs)
user:
  github_username: "${GITHUB_USER:-octocat}"
  name: "${USER_NAME:-Tech Lead}"

# LLM Providers Configuration
# Supported types: openai_compatible (Ollama, vLLM, Groq, OpenRouter, Custom Gateway), anthropic
llm:
  provider: "${LLM_PROVIDER:-openai_compatible}"
  api_base: "${LLM_API_BASE:-https://api.openai.com/v1}"
  api_key: "${LLM_API_KEY:-}"
  
  # Models configured by role
  models:
    # Fast model for triage, summaries, small chats
    fast: "${FAST_MODEL:-gpt-4o-mini}"
    # High-reasoning model for deep code reviews & complex reasoning
    reasoning: "${REASONING_MODEL:-gpt-4o}"
    
    # Selection options for Web UI
    available:
      - id: "${FAST_MODEL:-gpt-4o-mini}"
        name: "Fast Model (Triage / Summary)"
      - id: "${REASONING_MODEL:-gpt-4o}"
        name: "Reasoning Model (Deep Review / Architecture)"

# Task Tracker Provider (Shortcut, Jira, GitHub Issues)
task_tracker:
  provider: "${TASK_TRACKER_PROVIDER:-shortcut}" # options: shortcut, jira, github_issues
  api_token: "${TASK_TRACKER_TOKEN:-}"
  api_base: "${TASK_TRACKER_BASE:-https://api.app.shortcut.com/api/v3}"
  default_project_id: "${DEFAULT_PROJECT_ID:-}"
  default_workflow_state_id: "${DEFAULT_WORKFLOW_STATE_ID:-}"

storage:
  db_path: "data/watchers.db"

# Watchers Configuration
watchers:
  pr_reviewer:
    enabled: true
    interval_minutes: 30
    slack_channels:
      - "${SLACK_CHANNEL_1:-}"
      - "${SLACK_CHANNEL_2:-}"
    actions:
      post_to_github: false
      slack_reaction_on_start: ""
      slack_reaction_on_success: ""
      slack_reaction_on_issues: ""
      slack_reply_thread: false
      save_local_only: true
